name: Publish immutable release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit on main to publish
        required: true
        type: string
      submission_state:
        description: Contact form state embedded in the immutable web image
        required: true
        type: choice
        options: [disabled, enabled]
        default: disabled
      confirm_publish:
        description: Publish the image and signed function artifact
        required: true
        type: boolean
        default: false
      confirm_enable:
        description: Confirm publishing a request-capable enabled web image
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vbtech-release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact release
    if: github.event.inputs.confirm_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: read
      checks: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_SHA: ${{ github.event.inputs.release_sha }}
      PUBLISH_RUN_ID: ${{ github.run_id }}
      IMAGE_REPOSITORY: ghcr.io/thevladbog/vbtech-web
      VBTECH_SUBMISSION_STATE: ${{ github.event.inputs.submission_state }}
      VBTECH_CONFIRM_ENABLE: ${{ github.event.inputs.confirm_enable }}
      PUBLIC_SMARTCAPTCHA_SITE_KEY: ${{ vars.VBTECH_SMARTCAPTCHA_SITE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the requested release identity and CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SHA" == "$GITHUB_SHA" ]]
          [[ "$VBTECH_SUBMISSION_STATE" == "disabled" || "$VBTECH_SUBMISSION_STATE" == "enabled" ]]
          if [[ "$VBTECH_SUBMISSION_STATE" == "enabled" ]]; then
            [[ "$VBTECH_CONFIRM_ENABLE" == "true" ]]
            [[ -n "$PUBLIC_SMARTCAPTCHA_SITE_KEY" ]]
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          ci_success="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq '.check_runs | any(.name == "Verify repository" and .conclusion == "success")')"
          [[ "$ci_success" == "true" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Build exact artifacts
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run test:contracts
          corepack pnpm run build:function-artifact
          docker build --load --file deploy/container/web.Dockerfile \
            --build-arg VBTECH_RELEASE_SHA="$RELEASE_SHA" \
            --build-arg VBTECH_SUBMISSION_STATE="$VBTECH_SUBMISSION_STATE" \
            --build-arg PUBLIC_SMARTCAPTCHA_SITE_KEY="$PUBLIC_SMARTCAPTCHA_SITE_KEY" \
            --tag "$IMAGE_REPOSITORY:$RELEASE_SHA-$VBTECH_SUBMISSION_STATE" .
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the immutable image and capture its registry digest
        id: image
        run: |
          set -euo pipefail
          IMAGE_TAG="$IMAGE_REPOSITORY:$RELEASE_SHA-$VBTECH_SUBMISSION_STATE"
          if docker manifest inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Refusing to replace an existing immutable release tag" >&2
            exit 1
          fi
          docker push "$IMAGE_TAG"
          REPOSITORY_DIGEST="$(docker image inspect \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_TAG" \
            | awk -v repository="$IMAGE_REPOSITORY" \
              'index($0, repository "@") == 1 && !found { print; found = 1 } END { if (!found) exit 1 }')"
          IMAGE_DIGEST="${REPOSITORY_DIGEST#*@}"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Create strict release manifest and checksums
        env:
          IMAGE_TAG: ghcr.io/thevladbog/vbtech-web:${{ github.event.inputs.release_sha }}-${{ github.event.inputs.submission_state }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/vbtech-release"
          web_dir="$RUNNER_TEMP/vbtech-published-web"
          install -d -m 700 "$artifact_dir"
          install -d -m 700 "$web_dir"
          install -m 600 .artifacts/function/vbtech-contact-function.zip "$artifact_dir/vbtech-contact-function.zip"
          container_id="$(docker create "$IMAGE_TAG")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/srv/vbtech/." "$web_dir"
          node deploy/production/release-artifact.mjs create \
            "$artifact_dir/release-manifest.json" \
            "$artifact_dir/vbtech-contact-function.zip" \
            "$web_dir"
          (cd "$artifact_dir" && sha256sum vbtech-contact-function.zip > checksums.sha256)
          sha256sum "$artifact_dir/vbtech-contact-function.zip"
      - name: Attest the function archive and release manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ runner.temp }}/vbtech-release/vbtech-contact-function.zip
            ${{ runner.temp }}/vbtech-release/release-manifest.json
      - name: Attest the published image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/thevladbog/vbtech-web
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Upload immutable release handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vbtech-release-${{ github.event.inputs.release_sha }}-${{ github.event.inputs.submission_state }}
          path: ${{ runner.temp }}/vbtech-release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
